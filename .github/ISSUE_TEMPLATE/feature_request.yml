name: Feature request
description: Propose a scoped improvement
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and trust boundary
      description: What maintainer problem does this solve, and what untrusted input is involved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
