name: App validation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: patchproof-app-validation
  cancel-in-progress: false

jobs:
  app-validation:
    name: Validate the configured GitHub App
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: app-validation
    env:
      PATCHPROOF_VALIDATION_APP_ID: ${{ vars.PATCHPROOF_VALIDATION_APP_ID }}
      PATCHPROOF_VALIDATION_INSTALLATION_ID: ${{ vars.PATCHPROOF_VALIDATION_INSTALLATION_ID }}
      PATCHPROOF_VALIDATION_REPOSITORY: ${{ vars.PATCHPROOF_VALIDATION_REPOSITORY }}
      PATCHPROOF_VALIDATION_PR_NUMBER: ${{ vars.PATCHPROOF_VALIDATION_PR_NUMBER }}
      PATCHPROOF_VALIDATION_BASE_REF: ${{ vars.PATCHPROOF_VALIDATION_BASE_REF }}
      PATCHPROOF_VALIDATION_BASE_SHA: ${{ vars.PATCHPROOF_VALIDATION_BASE_SHA }}
      PATCHPROOF_VALIDATION_HEAD_SHA: ${{ vars.PATCHPROOF_VALIDATION_HEAD_SHA }}
      PATCHPROOF_VALIDATION_PATCHPROOF_SHA: ${{ vars.PATCHPROOF_VALIDATION_PATCHPROOF_SHA }}
    steps:
      - name: Validate the fixed dispatch contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = kwlck/PatchProof
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REF_NAME" = main
          test -n "$PATCHPROOF_VALIDATION_APP_ID"
          test -n "$PATCHPROOF_VALIDATION_INSTALLATION_ID"
          test "$PATCHPROOF_VALIDATION_REPOSITORY" = kwlck/PatchProof
          test -n "$PATCHPROOF_VALIDATION_PR_NUMBER"
          test "$PATCHPROOF_VALIDATION_BASE_REF" = main
          [[ "$PATCHPROOF_VALIDATION_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PATCHPROOF_VALIDATION_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PATCHPROOF_VALIDATION_PATCHPROOF_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$PATCHPROOF_VALIDATION_PATCHPROOF_SHA"
          [[ "$PATCHPROOF_VALIDATION_APP_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PATCHPROOF_VALIDATION_INSTALLATION_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PATCHPROOF_VALIDATION_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Verify the checkout is the approved SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PATCHPROOF_VALIDATION_PATCHPROOF_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.6.0

      - name: Discover and verify the exact CI bundle
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api='https://api.github.com/repos/kwlck/PatchProof'
          bundle_name='patchproof-app-validation-bundle'
          expected_sha="$PATCHPROOF_VALIDATION_PATCHPROOF_SHA"
          headers=(
            -H 'Accept: application/vnd.github+json'
            -H 'X-GitHub-Api-Version: 2022-11-28'
            -H "Authorization: Bearer $GITHUB_TOKEN"
          )

          runs_json="$(curl --fail-with-body --silent --show-error --location "${headers[@]}" \
            "$api/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100")"
          run_id="$(jq -er --arg expected_sha "$expected_sha" '
            [
              .workflow_runs[]
              | select(
                  .path == ".github/workflows/ci.yml"
                  and .name == "CI"
                  and .event == "push"
                  and .status == "completed"
                  and .conclusion == "success"
                  and .head_branch == "main"
                  and .head_sha == $expected_sha
                )
            ] as $matches
            | if ($matches | length) == 1 then $matches[0].id else error("CI run identity is ambiguous or missing") end
          ' <<<"$runs_json")"
          [[ "$run_id" =~ ^[0-9]+$ ]]

          run_json="$(curl --fail-with-body --silent --show-error --location "${headers[@]}" \
            "$api/actions/runs/$run_id")"
          jq -e --arg expected_sha "$expected_sha" --argjson expected_id "$run_id" '
            .id == $expected_id
            and .path == ".github/workflows/ci.yml"
            and .name == "CI"
            and .event == "push"
            and .status == "completed"
            and .conclusion == "success"
            and .head_branch == "main"
            and .head_sha == $expected_sha
            and .repository.full_name == "kwlck/PatchProof"
          ' <<<"$run_json" >/dev/null

          artifacts_json="$(curl --fail-with-body --silent --show-error --location "${headers[@]}" \
            "$api/actions/runs/$run_id/artifacts?per_page=100")"
          artifact_id="$(jq -er --arg name "$bundle_name" --argjson expected_id "$run_id" '
            [
              .artifacts[]
              | select(
                  .name == $name
                  and .expired == false
                  and .size_in_bytes > 0
                  and .workflow_run.id == $expected_id
                )
            ] as $matches
            | if ($matches | length) == 1 then $matches[0].id else error("validation artifact identity is ambiguous or missing") end
          ' <<<"$artifacts_json")"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]

          archive="$RUNNER_TEMP/patchproof-app-validation-bundle.zip"
          curl --fail-with-body --silent --show-error --location "${headers[@]}" \
            "$api/actions/artifacts/$artifact_id/zip" --output "$archive"
          while IFS= read -r entry; do
            case "$entry" in
              ''|/*|../*|*/../*|*/..|*\\*)
                echo 'artifact contains an unsafe path' >&2
                exit 1
                ;;
            esac
          done < <(unzip -Z1 "$archive")

          bundle="$RUNNER_TEMP/patchproof-app-validation-bundle"
          rm -rf "$bundle"
          mkdir -p "$bundle"
          unzip -q "$archive" -d "$bundle"
          if [[ ! -f "$bundle/manifest.json" ]]; then
            entries=("$bundle"/*)
            if [[ "${#entries[@]}" -ne 1 || ! -f "${entries[0]}/manifest.json" ]]; then
              echo 'validation bundle has no unambiguous manifest' >&2
              exit 1
            fi
            bundle="${entries[0]}"
          fi

          BUNDLE_ROOT="$bundle" EXPECTED_SHA="$expected_sha" EXPECTED_NAME="$bundle_name" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { lstat, readdir, readFile } from 'node:fs/promises';
          import { isAbsolute, join, relative, resolve, sep } from 'node:path';

          const root = process.env.BUNDLE_ROOT;
          const expectedSha = process.env.EXPECTED_SHA;
          const expectedName = process.env.EXPECTED_NAME;
          if (!root || !expectedSha || !expectedName) throw new Error('bundle verifier inputs are missing');
          const fail = (message) => {
            throw new Error(`validation bundle rejected: ${message}`);
          };
          const digest = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const manifestPath = join(root, 'manifest.json');
          const manifest = JSON.parse(await readFile(manifestPath, 'utf8'));
          if (
            manifest.version !== 1 ||
            manifest.artifactName !== expectedName ||
            manifest.repository !== 'kwlck/PatchProof' ||
            manifest.ref !== 'refs/heads/main' ||
            manifest.sourceSha !== expectedSha ||
            !Array.isArray(manifest.files) ||
            typeof manifest.inventorySha256 !== 'string'
          ) fail('manifest identity or shape mismatch');

          const entries = new Map();
          for (const file of manifest.files) {
            if (
              !file ||
              typeof file.path !== 'string' ||
              typeof file.bytes !== 'number' ||
              !Number.isSafeInteger(file.bytes) ||
              typeof file.sha256 !== 'string' ||
              !/^[0-9a-f]{64}$/u.test(file.sha256) ||
              file.path.length === 0 ||
              isAbsolute(file.path) ||
              file.path.includes('\\') ||
              file.path.split('/').some((part) => part.length === 0 || part === '.' || part === '..')
            ) fail('unsafe manifest path or digest entry');
            if (entries.has(file.path)) fail(`duplicate manifest path: ${file.path}`);
            const candidate = resolve(root, file.path);
            if (relative(root, candidate).startsWith(`..${sep}`)) fail('manifest path escapes bundle');
            const info = await lstat(candidate).catch(() => undefined);
            if (!info || !info.isFile()) fail(`manifest file is absent or not regular: ${file.path}`);
            const bytes = await readFile(candidate);
            if (bytes.byteLength !== file.bytes || digest(bytes) !== file.sha256)
              fail(`digest mismatch: ${file.path}`);
            entries.set(file.path, file);
          }

          const actual = [];
          async function walk(directory) {
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              if (path === manifestPath) continue;
              if (entry.isDirectory()) await walk(path);
              else if (entry.isFile()) {
                const bytes = await readFile(path);
                actual.push({
                  path: relative(root, path).split(sep).join('/'),
                  bytes: bytes.byteLength,
                  sha256: digest(bytes),
                });
              } else fail(`unsupported bundle entry: ${relative(root, path)}`);
            }
          }
          await walk(root);
          actual.sort((left, right) => left.path.localeCompare(right.path));
          const listed = [...entries.values()].sort((left, right) => left.path.localeCompare(right.path));
          if (JSON.stringify(actual) !== JSON.stringify(listed)) fail('manifest inventory does not match files');
          const inventory = `${listed.map((file) => `${file.sha256} ${file.bytes} ${file.path}`).join('\n')}\n`;
          if (digest(inventory) !== manifest.inventorySha256) fail('inventory digest mismatch');
          NODE

          cp -a "$bundle"/. "$GITHUB_WORKSPACE"/

      - name: Run the credentialed app harness
        working-directory: ${{ github.workspace }}
        env:
          PATCHPROOF_VALIDATION_APP_PRIVATE_KEY: ${{ secrets.PATCHPROOF_VALIDATION_APP_PRIVATE_KEY }}
          PATCHPROOF_VALIDATION_WEBHOOK_SECRET: ${{ secrets.PATCHPROOF_VALIDATION_WEBHOOK_SECRET }}
          APP_ID: ${{ vars.PATCHPROOF_VALIDATION_APP_ID }}
          INSTALLATION_ID: ${{ vars.PATCHPROOF_VALIDATION_INSTALLATION_ID }}
          REPOSITORY: ${{ vars.PATCHPROOF_VALIDATION_REPOSITORY }}
          PR_NUMBER: ${{ vars.PATCHPROOF_VALIDATION_PR_NUMBER }}
          BASE_REF: ${{ vars.PATCHPROOF_VALIDATION_BASE_REF }}
          BASE_SHA: ${{ vars.PATCHPROOF_VALIDATION_BASE_SHA }}
          HEAD_SHA: ${{ vars.PATCHPROOF_VALIDATION_HEAD_SHA }}
          PATCHPROOF_SHA: ${{ vars.PATCHPROOF_VALIDATION_PATCHPROOF_SHA }}
        run: node scripts/app-validation.mjs

      - name: Place the fixed validation summary
        if: ${{ success() }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          source_summary="$RUNNER_TEMP/patchproof-app-validation-summary.json"
          destination='work/app-validation/summary.json'
          test -f "$source_summary"
          mkdir -p "$(dirname "$destination")"
          cp -- "$source_summary" "$destination"

      - name: Scan the fixed summary for secrets
        if: ${{ success() }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          summary='work/app-validation/summary.json'
          test -f "$summary"
          # Fail closed when the scanner itself is unavailable.
          command -v rg >/dev/null
          if rg --quiet --no-messages \
            -e '-----BEGIN [A-Z ]+PRIVATE KEY-----' \
            -e 'gh[pousr]_[A-Za-z0-9_]{20,}' \
            -e 'github_pat_[A-Za-z0-9_]{20,}' \
            -e 'xox[baprs]-[A-Za-z0-9-]{20,}' \
            "$summary"; then
            echo 'validation summary contains a credential-like value' >&2
            exit 1
          fi

      - name: Upload the fixed validation summary
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patchproof-app-validation-summary
          path: work/app-validation/summary.json
          if-no-files-found: error
          retention-days: 3
