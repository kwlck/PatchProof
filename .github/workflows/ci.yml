name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm docs:check
      - run: pnpm editorial:check
      - run: pnpm audit --prod
      - run: pnpm package:check
      - name: Hash Linux package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "work/release/patchproof-$(node -p "require('./package.json').version").tgz" | awk '{print tolower($1)}' > work/release/linux-SHA256SUM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-hash-linux-${{ matrix.node-version }}
          path: work/release/linux-SHA256SUM

  windows-package:
    name: Windows package smoke / Node ${{ matrix.node-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:check
      - name: Hash Windows package
        shell: pwsh
        run: |
          $hash = (Get-FileHash (Join-Path work/release ("patchproof-" + (node -p "require('./package.json').version") + ".tgz")) -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path work/release/windows-SHA256 -Value $hash -NoNewline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-hash-windows-node-${{ matrix.node-version }}
          path: work/release/windows-SHA256

  compare-package-hashes:
    name: compare Linux/Windows package hashes
    needs: [checks, windows-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: package-hash-*
          path: hashes
          merge-multiple: false
      - name: Compare package hashes
        shell: bash
        run: |
          expected=(
            package-hash-linux-22/linux-SHA256SUM
            package-hash-linux-24/linux-SHA256SUM
            package-hash-windows-node-22/windows-SHA256
            package-hash-windows-node-24/windows-SHA256
          )
          hashes_seen=()
          for file in "${expected[@]}"; do
            path="hashes/$file"
            test -f "$path"
            hash="$(tr -d '\r\n' < "$path" | tr '[:upper:]' '[:lower:]')"
            [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
            hashes_seen+=("$hash")
          done
          for hash in "${hashes_seen[@]}"; do
            test "$hash" = "${hashes_seen[0]}"
          done

  docker:
    name: Docker integration
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker version
      - run: pnpm build
      - run: pnpm test:docker

  app-validation-bundle:
    name: App validation bundle
    needs: checks
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.16.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.6.0
          cache: pnpm
      - name: Install the immutable build inputs
        run: pnpm install --frozen-lockfile
      - name: Build the exact checked-out SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          pnpm build
      - name: Assemble credential-free validation bundle
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/patchproof-app-validation-bundle"
          rm -rf "$bundle"
          mkdir -p "$bundle/apps/github-app" "$bundle/node_modules/@patchproof" "$bundle/node_modules/yaml" "$bundle/packages" "$bundle/scripts"
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml "$bundle/"
          cp scripts/app-validation.mjs "$bundle/scripts/app-validation.mjs"
          cp -a fixtures "$bundle/fixtures"
          mkdir -p "$bundle/test"
          cp -a test/fixtures "$bundle/test/fixtures"
          cp apps/github-app/package.json "$bundle/apps/github-app/package.json"
          cp -a apps/github-app/dist "$bundle/apps/github-app/dist"
          for workspace in core config runner report github testkit cli; do
            mkdir -p "$bundle/packages/$workspace" "$bundle/node_modules/@patchproof/$workspace"
            cp "packages/$workspace/package.json" "$bundle/packages/$workspace/package.json"
            cp -a "packages/$workspace/dist" "$bundle/packages/$workspace/dist"
            cp "packages/$workspace/package.json" "$bundle/node_modules/@patchproof/$workspace/package.json"
            cp -a "packages/$workspace/dist" "$bundle/node_modules/@patchproof/$workspace/dist"
          done
          cp -aL node_modules/yaml/. "$bundle/node_modules/yaml/"
          # The assignment keeps the step fail-closed when find itself errors.
          symlink_probe="$(find "$bundle" -type l -print -quit)"
          if [[ -n "$symlink_probe" ]]; then
            echo 'validation bundle must not contain symbolic links' >&2
            exit 1
          fi
          SOURCE_SHA="$SOURCE_SHA" BUNDLE_ROOT="$bundle" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { join, relative, sep } from 'node:path';

          const root = process.env.BUNDLE_ROOT;
          const sourceSha = process.env.SOURCE_SHA;
          if (!root || !sourceSha) throw new Error('bundle inputs are missing');
          const digest = (bytes) => createHash('sha256').update(bytes).digest('hex');
          const files = [];
          async function walk(directory) {
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              if (entry.name === 'manifest.json' && directory === root) continue;
              if (entry.isDirectory()) await walk(path);
              else if (entry.isFile()) {
                const bytes = await readFile(path);
                files.push({
                  path: relative(root, path).split(sep).join('/'),
                  bytes: bytes.byteLength,
                  sha256: digest(bytes),
                });
              } else throw new Error(`unsupported bundle entry: ${path}`);
            }
          }
          await walk(root);
          files.sort((left, right) => left.path.localeCompare(right.path));
          const inventory = `${files.map((file) => `${file.sha256} ${file.bytes} ${file.path}`).join('\n')}\n`;
          const manifest = {
            version: 1,
            artifactName: 'patchproof-app-validation-bundle',
            repository: 'kwlck/PatchProof',
            ref: 'refs/heads/main',
            sourceSha,
            files,
            inventorySha256: digest(inventory),
          };
          await writeFile(join(root, 'manifest.json'), `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          SOURCE_SHA="$GITHUB_SHA" BUNDLE_ROOT="$bundle" node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { join } from 'node:path';

          const manifest = JSON.parse(await readFile(join(process.env.BUNDLE_ROOT, 'manifest.json'), 'utf8'));
          if (manifest.sourceSha !== process.env.SOURCE_SHA) throw new Error('bundle SHA binding is invalid');
          NODE
      - name: Upload exact-SHA app validation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: patchproof-app-validation-bundle
          path: ${{ runner.temp }}/patchproof-app-validation-bundle
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
