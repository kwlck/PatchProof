name: v0.10 branch type fix

on:
  push:
    branches: [codex/v0.10-core]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/v0.10-core
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply type fixes
        shell: python
        run: |
          from pathlib import Path

          allowlist = Path('packages/runner/src/allowlist-docker.ts')
          text = allowlist.read_text()
          old = """function controlEnvironment(spec: ExecutionSpec): NodeJS.ProcessEnv {\n  return dockerLauncherEnvironment(spec.launcherEnvironment);\n}\n"""
          new = """function controlEnvironment(spec: ExecutionSpec): Record<string, string> {\n  return Object.fromEntries(\n    Object.entries(dockerLauncherEnvironment(spec.launcherEnvironment)).filter(\n      (entry): entry is [string, string] => typeof entry[1] === 'string',\n    ),\n  );\n}\n"""
          if old not in text:
              raise SystemExit('allowlist replacement target not found')
          allowlist.write_text(text.replace(old, new))

          bundle = Path('packages/cli/src/bundle.ts')
          text = bundle.read_text()
          old = """  const baseSource = options.baseSource ??\n    run?.base.source ?? {\n      ref: 'base',\n      sha256: sha256(options.configResult.sourcePath),\n      kind: 'directory-tree' as const,\n      location: dirname(options.configResult.sourcePath),\n      revision: 'base' as const,\n    };\n  const headSource = options.headSource ??\n    run?.head.source ?? {\n      ref: 'head',\n      sha256: sha256(options.configResult.sourcePath),\n      kind: 'directory-tree' as const,\n      location: dirname(options.configResult.sourcePath),\n      revision: 'head' as const,\n    };\n"""
          new = """  const baseSource: SourceSnapshot =\n    options.baseSource ??\n    (run?.base.source === undefined\n      ? {\n          ref: 'base',\n          sha256: sha256(options.configResult.sourcePath),\n          kind: 'directory-tree' as const,\n          location: dirname(options.configResult.sourcePath),\n          revision: 'base' as const,\n        }\n      : { ...run.base.source, revision: 'base' as const });\n  const headSource: SourceSnapshot =\n    options.headSource ??\n    (run?.head.source === undefined\n      ? {\n          ref: 'head',\n          sha256: sha256(options.configResult.sourcePath),\n          kind: 'directory-tree' as const,\n          location: dirname(options.configResult.sourcePath),\n          revision: 'head' as const,\n        }\n      : { ...run.head.source, revision: 'head' as const });\n"""
          if old not in text:
              raise SystemExit('bundle replacement target not found')
          bundle.write_text(text.replace(old, new))
      - run: pnpm prettier --write packages/runner/src/allowlist-docker.ts packages/cli/src/bundle.ts
      - run: pnpm typecheck
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/runner/src/allowlist-docker.ts packages/cli/src/bundle.ts
          git commit -m "Fix v0.10 source and launcher types"
          git push origin HEAD:codex/v0.10-core
