name: v0.10 branch formatter

on:
  push:
    branches: [codex/v0.10-core]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/v0.10-core
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11.16.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write packages/cli/src/bundle.ts packages/cli/src/setup-app.ts packages/core/src/evidence-v2.ts packages/runner/src/allowlist-docker.ts packages/runner/src/engine.ts packages/runner/src/policy.ts test/v010-core.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/cli/src/bundle.ts packages/cli/src/setup-app.ts packages/core/src/evidence-v2.ts packages/runner/src/allowlist-docker.ts packages/runner/src/engine.ts packages/runner/src/policy.ts test/v010-core.test.ts
          git commit -m "Format v0.10 core changes"
          git push origin HEAD:codex/v0.10-core
